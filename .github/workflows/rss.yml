name: Generate RSS


on:

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:


jobs:

  rss:

    runs-on:
      ubuntu-latest


    steps:


    - name:
        Checkout

      uses:
        actions/checkout@v4



    - name:
        Setup Node

      uses:
        actions/setup-node@v4

      with:

        node-version:
          24



    - name:
        Generate RSS

      run:

        node generate-rss.js



    - name:
        Commit RSS

      run:

        |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add feed.xml

          git commit -m "update rss" || exit 0

          git push
