name: Update Security News


on:

  schedule:

    - cron: "0 */6 * * *"


  workflow_dispatch:



jobs:

  update:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v5



    - name: Setup Python

      uses: actions/setup-python@v6

      with:

        python-version: "3.11"



    - name: Install package

      run:

        pip install feedparser



    - name: Run spider

      run:

        python it/security-news/crawler/spider.py



    - name: Commit

      run:


        git config user.name github-actions


        git config user.email github-actions@github.com


        git add .


        git commit -m "update security news" || exit 0


        git push
