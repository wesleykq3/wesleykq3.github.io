name: Generate RSS


on:

 schedule:

 - cron: "0 */6 * * *"


 workflow_dispatch:



jobs:


 rss:


  runs-on:
   ubuntu-latest


  steps:


  - uses:
      actions/checkout@v4


  - uses:
      actions/setup-node@v4

    with:

      node-version:
       22


  - name:
      Generate RSS

    run:

      node generate-rss.js



  - name:
      Commit

    run:

      |
       git config user.name github-actions
       git config user.email github-actions

       git add feed.xml

       git commit -m "update rss" || exit 0

       git push
