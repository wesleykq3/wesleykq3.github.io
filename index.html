<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wesley 的个人站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 基础样式重置 */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width:1000px; margin:0 auto;
      background:#fafafa; height:100vh;
      display:flex; flex-direction:column;
      overflow:hidden; position:relative;
    }

    /* 左上角头像和标题 */
    .header-container {
      position:absolute; top:30px; left:30px;
      display:flex; align-items:center; gap:15px; z-index:10;
    }
    .avatar { width:60px; height:60px; border-radius:50%; object-fit:cover; border:3px solid #2d8cf0; box-shadow:0 3px 10px rgba(0,0,0,0.1);}
    .site-title { font-size:24px; color:#2c3e50; font-weight:bold; }

    /* 主内容区域 */
    .main-content {
      flex:1; display:flex; flex-direction:column;
      justify-content:center; align-items:center;
      width:100%; padding:30px; padding-top:120px;
    }

    /* 网格导航 */
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:25px; width:100%; max-width:900px; margin-bottom:40px;}
    .grid a {
      padding:30px; background:#2d8cf0; color:#fff;
      text-decoration:none; border-radius:10px;
      font-size:20px; font-weight:bold;
      display:flex; justify-content:center; align-items:center;
      min-height:120px; transition:all 0.3s;
    }
    .grid a:hover { background:#1a73e8; transform:translateY(-5px); box-shadow:0 8px 20px rgba(0,0,0,0.15); }

    /* 底部日期 */
    footer { width:100%; font-size:18px; color:#666; text-align:center; padding:20px 0; margin-top:220px; }
    footer p { font-weight:bold; }

    /* 右下角IP信息浮窗 */
    .ip-info {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(45, 140, 240, 0.9);
      color: white;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      z-index: 100;
      max-width: 280px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    
    .ip-info:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }
    
    .ip-info .ip-title {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .ip-info .ip-title i {
      font-size: 16px;
    }
    
    .ip-info .ip-address {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
    }
    
    .ip-info .city-info {
      font-size: 14px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .ip-info .city-info i {
      font-size: 14px;
    }
    
    .ip-info .loading {
      font-size: 14px;
      font-style: italic;
      opacity: 0.8;
    }
    
    .ip-info .error {
      font-size: 14px;
      color: #ffdddd;
    }

    /* 响应式 */
    @media(max-width:768px){
      .header-container { top:20px; left:20px; }
      .avatar{width:50px;height:50px;}
      .site-title{font-size:20px;}
      .main-content{padding-top:110px;}
      .grid{grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:30px;}
      footer{font-size:16px; padding:15px 0; margin-top:15px;}
      .ip-info{bottom:15px; right:15px; padding:10px 15px; max-width:240px;}
      .ip-info .ip-address{font-size:14px;}
      .ip-info .city-info{font-size:13px;}
    }
    @media(max-width:480px){
      .header-container { top:15px; left:15px;}
      .avatar{width:40px;height:40px;}
      .site-title{font-size:18px;}
      .main-content{padding-top:100px; padding-left:15px; padding-right:15px;}
      .grid{grid-template-columns:1fr; gap:15px; margin-bottom:25px;}
      .grid a{padding:25px; font-size:18px; min-height:100px;}
      footer{font-size:16px; padding:12px 0; margin-top:12px;}
      .ip-info{bottom:10px; right:10px; padding:8px 12px; max-width:200px;}
      .ip-info .ip-title{font-size:12px;}
      .ip-info .ip-address{font-size:13px; margin-bottom:5px;}
      .ip-info .city-info{font-size:12px;}
    }
  </style>
</head>
<body>

<!-- 左上角头像和标题 -->
<div class="header-container">
  <img src="images/avatar.png" alt="Wesley头像" class="avatar">
  <h1 class="site-title">Wesley 的主页</h1>
</div>

<!-- 主内容 -->
<div class="main-content">
  <nav class="grid">
    <a href="it/index.html">IT</a>
    <a href="life/index.html">生活</a>
    <a href="job/index.html">找工作</a>
    <a href="reading/index.html">读书笔记</a>
    <a href="game/index.html">小游戏</a>
    <a href="others/index.html">其他</a>
  </nav>
  <footer>
    <p>© <span id="currentDate"></span></p>
  </footer>
</div>

<!-- 右下角IP信息浮窗 -->
<div class="ip-info">
  <div class="ip-title">
    <i class="fas fa-network-wired"></i>
    <span>您的网络信息</span>
  </div>
  <div class="ip-address" id="ipAddress">正在获取IP地址...</div>
  <div class="city-info" id="cityInfo">
    <i class="fas fa-map-marker-alt"></i>
    <span>正在获取位置...</span>
  </div>
</div>

<script>
// 设置当前日期
function formatDate(date){
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  return `${y}年${m<10?'0'+m:m}月${d<10?'0'+d:d}日`;
}

// 获取IP地址和地理位置信息
async function getIPInfo() {
  const ipAddressEl = document.getElementById('ipAddress');
  const cityInfoEl = document.getElementById('cityInfo');
  
  try {
    // 方法1: 使用ipify获取IP地址（简单可靠）
    const ipResponse = await fetch('https://api.ipify.org?format=json');
    const ipData = await ipResponse.json();
    const ip = ipData.ip;
    
    // 更新IP地址显示
    ipAddressEl.textContent = ip;
    ipAddressEl.classList.remove('loading');
    
    // 方法2: 使用国内API获取IP详细信息（包括地理位置）
    try {
      // 尝试使用国内API获取位置信息
      const infoResponse = await fetch(`https://ipapi.co/${ip}/json/`);
      const infoData = await infoResponse.json();
      
      if (infoData.city && infoData.region) {
        cityInfoEl.innerHTML = `<i class="fas fa-map-marker-alt"></i><span>${infoData.city}, ${infoData.region}, ${infoData.country_name}</span>`;
      } else if (infoData.country_name) {
        cityInfoEl.innerHTML = `<i class="fas fa-map-marker-alt"></i><span>${infoData.country_name}</span>`;
      } else {
        throw new Error('无法获取详细位置信息');
      }
    } catch (geoError) {
      // 如果第一个API失败，尝试备用API
      try {
        const fallbackResponse = await fetch(`https://ipapi.com/ip_api.php?ip=${ip}`);
        const fallbackData = await fallbackResponse.json();
        
        if (fallbackData.city && fallbackData.regionName) {
          cityInfoEl.innerHTML = `<i class="fas fa-map-marker-alt"></i><span>${fallbackData.city}, ${fallbackData.regionName}, ${fallbackData.country}</span>`;
        } else if (fallbackData.country) {
          cityInfoEl.innerHTML = `<i class="fas fa-map-marker-alt"></i><span>${fallbackData.country}</span>`;
        } else {
          throw new Error('无法获取位置信息');
        }
      } catch (fallbackError) {
        // 如果所有API都失败，显示IP但无位置信息
        cityInfoEl.innerHTML = `<i class="fas fa-map-marker-alt"></i><span>位置信息不可用</span>`;
        console.log('无法获取地理位置信息，仅显示IP地址');
      }
    }
    
    // 添加点击复制IP的功能
    ipAddressEl.style.cursor = 'pointer';
    ipAddressEl.title = '点击复制IP地址';
    ipAddressEl.addEventListener('click', function() {
      navigator.clipboard.writeText(ip).then(() => {
        const originalText = ipAddressEl.textContent;
        ipAddressEl.textContent = '已复制到剪贴板!';
        ipAddressEl.style.color = '#aaffaa';
        
        setTimeout(() => {
          ipAddressEl.textContent = originalText;
          ipAddressEl.style.color = '';
        }, 1500);
      });
    });
    
  } catch (error) {
    console.error('获取IP信息失败:', error);
    ipAddressEl.textContent = '获取失败';
    ipAddressEl.className = 'ip-address error';
    cityInfoEl.innerHTML = '<span class="error">请检查网络连接</span>';
  }
}

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded', function(){
  // 设置当前日期
  document.getElementById('currentDate').textContent = formatDate(new Date());
  
  // 获取IP信息（延迟1秒执行，避免影响页面主要内容加载）
  setTimeout(getIPInfo, 1000);
  
  // 添加隐私提示（符合法律要求）
  console.log('本页面收集您的IP地址用于访问统计，我们不会存储或用于其他用途。');
  
  // 可选：在控制台显示更多信息
  console.log('正在获取您的网络信息...');
});
</script>

</body>
</html>
