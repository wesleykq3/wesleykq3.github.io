<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wesley 的个人站</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 重置默认样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      background: #fafafa;
      height: 100vh; /* 固定高度，不滚动 */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* 左上角头像和标题容器 */
    .header-container {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2d8cf0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    
    .site-title {
      font-size: 24px;
      color: #2c3e50;
      margin: 0;
      font-weight: bold;
    }
    
    /* 主内容区域 */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 30px;
      padding-top: 120px;
    }
    
    /* 导航网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 40px;
    }
    
    .grid a {
      padding: 30px;
      background: #2d8cf0;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    
    .grid a:hover {
      background: #1a73e8;
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
    
    /* 底部日期 */
    footer {
      width: 100%;
      font-size: 18px;
      color: #666;
      text-align: center;
      padding: 20px 0;
      margin-top: 220px;
    }
    
    footer p {
      font-weight: bold;
      margin: 0;
    }
    
    /* 访客信息右下角 */
    #visitor-info {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    #visitor-info i {
      color: #ffd700;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .header-container {
        top: 20px;
        left: 20px;
      }
      
      .avatar {
        width: 50px;
        height: 50px;
      }
      
      .site-title {
        font-size: 20px;
      }
      
      .main-content {
        padding-top: 110px;
      }
      
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 30px;
      }
      
      footer {
        font-size: 16px;
        padding: 15px 0;
        margin-top: 15px;
      }
    }
    
    @media (max-width: 480px) {
      .header-container {
        top: 15px;
        left: 15px;
      }
      
      .avatar {
        width: 40px;
        height: 40px;
      }
      
      .site-title {
        font-size: 18px;
      }
      
      .main-content {
        padding-top: 100px;
        padding-left: 15px;
        padding-right: 15px;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 15px;
        margin-bottom: 25px;
      }
      
      .grid a {
        padding: 25px;
        font-size: 18px;
        min-height: 100px;
      }
      
      footer {
        font-size: 16px;
        padding: 12px 0;
        margin-top: 12px;
      }
    }
    
    @media (max-height: 700px) {
      .main-content {
        padding-top: 100px;
      }
      
      .grid {
        gap: 15px;
        margin-bottom: 30px;
      }
      
      .grid a {
        padding: 20px;
        min-height: 100px;
        font-size: 18px;
      }
      
      footer {
        padding: 15px 0;
        margin-top: 15px;
      }
    }
    
    @media (max-height: 600px) {
      .main-content {
        padding-top: 90px;
      }
      
      .grid {
        margin-bottom: 20px;
      }
      
      .grid a {
        padding: 15px;
        min-height: 80px;
        font-size: 16px;
      }
      
      footer {
        padding: 10px 0;
        margin-top: 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<!-- 左上角头像和标题 -->
<div class="header-container">
  <img src="images/avatar.png" alt="Wesley头像" class="avatar">
  <h1 class="site-title">Wesley 的主页</h1>
</div>

<!-- 主内容区域 -->
<div class="main-content">
  <nav class="grid">
    <a href="it/index.html">IT</a>
    <a href="life/index.html">生活</a>
    <a href="job/index.html">找工作</a>
    <a href="reading/index.html">读书笔记</a>
    <a href="game/index.html">小游戏</a>
    <a href="others/index.html">其他</a>
  </nav>
  
  <!-- 底部日期 -->
  <footer>
    <p>© <span id="currentDate"></span></p>
  </footer>
</div>

<!-- 右下角访客信息 -->
<div id="visitor-info">
  <i class="fas fa-user"></i>
  <span id="visitor-text">加载访客信息中...</span>
</div>

<script>
// 动态设置当前日期
function formatDate(date) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  
  const formattedMonth = month < 10 ? '0' + month : month;
  const formattedDay = day < 10 ? '0' + day : day;
  
  return `${year}年${formattedMonth}月${formattedDay}日`;
}

document.addEventListener('DOMContentLoaded', function() {
  const now = new Date();
  const dateElement = document.getElementById('currentDate');
  if (dateElement) {
    dateElement.textContent = formatDate(now);
  }
  
  // 获取访客 IP 和城市
  async function showVisitorInfo() {
    const infoSpan = document.getElementById('visitor-text');
    try {
      const response = await fetch('http://ip-api.com/json/?lang=zh-CN');
      const data = await response.json();
      const ip = data.query;
      const city = data.city;
      const region = data.regionName;
      const country = data.country;
      
      infoSpan.textContent = `访客 IP: ${ip} | 所在地: ${city}, ${region}, ${country}`;
    } catch (err) {
      console.error(err);
      infoSpan.textContent = '无法获取访客信息';
    }
  }
  
  showVisitorInfo();
});
</script>
<img src="https://visitor-badge.laobi.icu/badge?page_id=wesleykq3.wesleykq3.github.io" alt="Visitor Count">

</body>
</html>
