<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wesley 的个人站</title>
  <style>
    /* 重置默认样式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* 主体样式 - 单页面，不滚动 */
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      background: #fafafa;
      height: 100vh; /* 固定高度，不滚动 */
      display: flex;
      flex-direction: column;
      overflow: hidden; /* 隐藏溢出内容 */
    }
    
    /* 左上角头像和标题容器 */
    .header-container {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #2d8cf0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }
    
    .site-title {
      font-size: 24px;
      color: #2c3e50;
      margin: 0;
      font-weight: bold;
    }
    
    /* 主内容区域 - 居中，占据大部分空间 */
    .main-content {
      flex: 1; /* 占据可用空间 */
      display: flex;
      flex-direction: column;
      justify-content: center; /* 垂直居中 */
      align-items: center;
      width: 100%;
      padding: 30px;
      padding-top: 120px; /* 为顶部头像留出空间 */
    }
    
    /* 导航网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 40px; /* 增加网格底部间距，使日期下移 */
    }
    
    .grid a {
      padding: 30px;
      background: #2d8cf0;
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    
    .grid a:hover {
      background: #1a73e8;
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
    
    /* 底部日期 - 下移，远离网格 */
    footer {
      width: 100%;
      font-size: 18px;
      color: #666;
      text-align: center;
      padding: 20px 0;
      margin-top: 220px; /* 增加上边距，使日期进一步下移 */
    }
    
    footer p {
      font-weight: bold;
      margin: 0;
    }
    
    /* 其他原有样式保持不变 */
    .menu li {
      list-style: none;
      margin: 10px 0;
    }
    
    .article-list li {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
    }
    
    .date {
      color: #999;
      font-size: 14px;
    }
    
    article {
      line-height: 1.8;
    }
    
    .meta {
      color: #666;
      font-size: 14px;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .header-container {
        top: 20px;
        left: 20px;
      }
      
      .avatar {
        width: 50px;
        height: 50px;
      }
      
      .site-title {
        font-size: 20px;
      }
      
      .main-content {
        padding-top: 110px;
      }
      
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 30px; /* 调整移动端网格底部间距 */
      }
      
      footer {
        font-size: 16px;
        padding: 15px 0;
        margin-top: 15px; /* 调整移动端日期上边距 */
      }
    }
    
    @media (max-width: 480px) {
      .header-container {
        top: 15px;
        left: 15px;
      }
      
      .avatar {
        width: 40px;
        height: 40px;
      }
      
      .site-title {
        font-size: 18px;
      }
      
      .main-content {
        padding-top: 100px;
        padding-left: 15px;
        padding-right: 15px;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 15px;
        margin-bottom: 25px; /* 调整小屏幕网格底部间距 */
      }
      
      .grid a {
        padding: 25px;
        font-size: 18px;
        min-height: 100px;
      }
      
      footer {
        font-size: 16px;
        padding: 12px 0;
        margin-top: 12px; /* 调整小屏幕日期上边距 */
      }
    }
    
    /* 超小屏幕调整 */
    @media (max-height: 700px) {
      .main-content {
        padding-top: 100px;
      }
      
      .grid {
        gap: 15px;
        margin-bottom: 30px; /* 调整小高度屏幕网格底部间距 */
      }
      
      .grid a {
        padding: 20px;
        min-height: 100px;
        font-size: 18px;
      }
      
      footer {
        padding: 15px 0;
        margin-top: 15px; /* 调整小高度屏幕日期上边距 */
      }
    }
    
    @media (max-height: 600px) {
      .main-content {
        padding-top: 90px;
      }
      
      .grid {
        margin-bottom: 20px; /* 进一步调整网格底部间距 */
      }
      
      .grid a {
        padding: 15px;
        min-height: 80px;
        font-size: 16px;
      }
      
      footer {
        padding: 10px 0;
        margin-top: 10px; /* 进一步调整日期上边距 */
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<!-- 左上角头像和标题 -->
<div class="header-container">
  <img src="images/avatar.png" alt="Wesley头像" class="avatar">
  <h1 class="site-title">Wesley 的主页</h1>
</div>

<!-- 主内容区域 -->
<div class="main-content">
  <nav class="grid">
    <a href="it/index.html">IT</a>
    <a href="life/index.html">生活</a>
    <a href="job/index.html">找工作</a>
    <a href="reading/index.html">读书笔记</a>
    <a href="game/index.html">小游戏</a>
    <a href="others/index.html">其他</a>
  </nav>
  
  <!-- 底部日期 - 下移，远离网格 -->
  <footer>
    <p>© <span id="currentDate"></span></p>
  </footer>
</div>

<script>
// 动态设置当前日期
function formatDate(date) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  
  const formattedMonth = month < 10 ? '0' + month : month;
  const formattedDay = day < 10 ? '0' + day : day;
  
  return `${year}年${formattedMonth}月${formattedDay}日`;
}

document.addEventListener('DOMContentLoaded', function() {
  const now = new Date();
  const dateElement = document.getElementById('currentDate');
  
  if (dateElement) {
    dateElement.textContent = formatDate(now);
  }
});
</script>

</body>
</html>
