<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生活 - Wesley 的主页</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 40px 120px; /* 底部留空间，避免遮挡 */
    }

    .job-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .job-header,
    .job-item {
      display: grid;
      grid-template-columns: 3fr 2fr;
      padding: 16px 24px;
      align-items: center;
    }

    .job-header {
      background: #f0f3f7;
      font-weight: bold;
      color: #555;
    }

    .job-item {
      border-top: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }

    .job-item:hover {
      background: #f8fbff;
    }

    .job-title {
      color: #2c3e50;
      font-weight: 600;
    }

    .job-date {
      color: #666;
      font-size: 14px;
      text-align: right;
    }

    /* ===== 新增：底部中间返回首页按钮 ===== */
    .back-home {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .back-home:hover {
      background: #1558c0;
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 12px 26px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="job-container">
  <div class="job-header">
    <div>标题</div>
    <div style="text-align:right;">发布日期</div>
  </div>

  <div class="job-item" onclick="window.location.href='./01.html'">
    <div class="job-title">纸质书籍回收方法</div>
    <div class="job-date">2026-01-01</div>
  </div>

  <div class="job-item" onclick="window.location.href='./02.html'">
    <div class="job-title">为什么大"慈"又要大"悲"</div>
    <div class="job-date">2026-01-02</div>
  </div>
  <div class="job-item" onclick="window.location.href='./03.html'">
    <div class="job-title">从佛法中学习到赚钱的艺术</div>
    <div class="job-date">2026-01-02</div>
  </div>
</div>

<!-- 页面底部中间：返回首页按钮 -->
<a href="../index.html" class="back-home">返回首页</a>

</body>
</html>
