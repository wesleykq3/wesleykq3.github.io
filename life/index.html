<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>生活 - Wesley 的主页</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
    }

    .job-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .job-header,
    .job-item {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr 2fr;
      padding: 16px 24px;
      align-items: center;
    }

    .job-header {
      background: #f0f3f7;
      font-weight: bold;
      color: #555;
    }

    .job-item {
      border-top: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }

    .job-item:hover {
      background: #f8fbff;
    }

    .job-title {
      color: #2c3e50;
      font-weight: 600;
    }

    .job-meta {
      color: #666;
      font-size: 14px;
    }

    .job-date {
      color: #666;
      font-size: 14px;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="job-container">
  <div class="job-header">
    <div>标题</div>
    <div style="text-align:right;">发布日期</div>
  </div>

  <div class="job-item" onclick="window.location.href='./01.html'">
    <div class="job-title">纸质书籍回收方法</div>
    <div class="job-date">2026-01-01</div>
  </div>

    <div class="job-date">2025-12-28</div>
  </div>

  <div class="job-item" onclick="openJob(3)">
    <div class="job-title">云平台运维工程师</div>
    <div class="job-meta">远程</div>
    <div class="job-meta">LinkedIn</div>
    <div class="job-date">2025-12-20</div>
  </div>
-->
</div>
</body>
</html>
