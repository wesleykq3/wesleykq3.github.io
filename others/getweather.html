<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当前位置天气查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #74b9ff, #0984e3, #00cec9);
        }
        
        h1 {
            color: #2d3436;
            margin-bottom: 15px;
            font-size: 32px;
            background: linear-gradient(90deg, #0984e3, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .description {
            color: #636e72;
            margin-bottom: 35px;
            font-size: 16px;
        }
        
        .location-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .location-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .location-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .location-label {
            font-weight: 700;
            color: #2d3436;
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        
        .location-value {
            color: #2d3436;
            font-size: 20px;
            word-break: break-all;
            min-height: 28px;
            font-weight: 600;
            padding-left: 35px;
        }
        
        .location-value.placeholder {
            color: #a0aec0;
            font-style: italic;
            font-weight: normal;
        }
        
        .weather-card {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 25px rgba(116, 185, 255, 0.3);
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .weather-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" opacity="0.1"><path d="M50,20 A30,30 0 1,1 20,50 A30,30 0 0,1 50,20z" fill="white"/></svg>');
            background-repeat: repeat;
            opacity: 0.1;
        }
        
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .weather-icon {
            font-size: 64px;
            margin-right: 20px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        
        .weather-temp {
            font-size: 56px;
            font-weight: 800;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .weather-desc {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .weather-details {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .weather-detail-item {
            text-align: center;
            padding: 10px;
            min-width: 120px;
        }
        
        .detail-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 20px;
            font-weight: 700;
        }
        
        .btn {
            background: linear-gradient(135deg, #00cec9 0%, #00b894 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 206, 201, 0.3);
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 206, 201, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
        }
        
        .loading.active {
            display: inline-block;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(116, 185, 255, 0.2);
            border-radius: 50%;
            border-top-color: #74b9ff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #e53e3e;
            background-color: #fff5f5;
            padding: 18px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            border-left: 5px solid #e53e3e;
            text-align: left;
        }
        
        .error.active {
            display: block;
        }
        
        .success {
            color: #38a169;
            background-color: #f0fff4;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border-left: 5px solid #38a169;
        }
        
        .success.active {
            display: block;
        }
        
        .note {
            font-size: 14px;
            color: #718096;
            margin-top: 30px;
            line-height: 1.6;
            text-align: center;
        }
        
        .icon {
            margin-right: 12px;
            font-size: 22px;
        }
        
        .location-icon {
            color: #0984e3;
        }
        
        .weather-icon {
            color: #74b9ff;
        }
        
        .api-info {
            background-color: rgba(116, 185, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            font-size: 14px;
            color: #2d3436;
            border-left: 4px solid #74b9ff;
        }
        
        .api-info strong {
            color: #0984e3;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .btn {
                width: 100%;
                padding: 16px 20px;
            }
            
            .location-card {
                padding: 20px;
            }
            
            .location-value {
                font-size: 18px;
                padding-left: 0;
            }
            
            .weather-card {
                padding: 20px;
            }
            
            .weather-temp {
                font-size: 42px;
            }
            
            .weather-desc {
                font-size: 20px;
            }
            
            .weather-icon {
                font-size: 48px;
                margin-right: 15px;
            }
            
            .weather-detail-item {
                min-width: 100px;
                padding: 8px;
            }
        }
        
        .retry-btn {
            background: #ed8936;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        
        .retry-btn:hover {
            background: #dd6b20;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>当前位置天气查询</h1>
        <p class="description">获取您当前所在城市的实时天气信息</p>
        
        <button class="btn" id="getWeatherBtn">
            <span id="btnText">获取当前位置天气</span>
        </button>
        
        <div class="loading" id="loading">
            <span class="loading-spinner"></span>
            <span>正在获取位置和天气信息...</span>
        </div>
        
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        
        <div class="location-card">
            <div class="location-item">
                <span class="location-label">
                    <span class="icon location-icon">📍</span> 当前位置
                </span>
                <div class="location-value placeholder" id="currentLocation">等待获取...</div>
            </div>
        </div>
        
        <div class="weather-card" id="weatherCard" style="display: none;">
            <div class="weather-desc" id="weatherDesc">--</div>
            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">☀️</div>
                <div class="weather-temp" id="weatherTemp">--°C</div>
            </div>
            <div class="weather-details">
                <div class="weather-detail-item">
                    <div class="detail-label">体感温度</div>
                    <div class="detail-value" id="feelsLike">--°C</div>
                </div>
                <div class="weather-detail-item">
                    <div class="detail-label">湿度</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="weather-detail-item">
                    <div class="detail-label">风速</div>
                    <div class="detail-value" id="windSpeed">-- km/h</div>
                </div>
            </div>
        </div>
        
        <div class="api-info">
            <strong>天气数据来源:</strong> 使用 wttr.in 免费天气API
        </div>
        
        <p class="note">
            注意：位置信息基于您的IP地址，天气信息为实时数据。<br>
            首次使用可能需要允许位置访问权限，系统不会存储您的任何个人信息。
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const getWeatherBtn = document.getElementById('getWeatherBtn');
            const btnText = document.getElementById('btnText');
            const currentLocationElement = document.getElementById('currentLocation');
            const weatherCard = document.getElementById('weatherCard');
            const weatherDesc = document.getElementById('weatherDesc');
            const weatherIcon = document.getElementById('weatherIcon');
            const weatherTemp = document.getElementById('weatherTemp');
            const feelsLike = document.getElementById('feelsLike');
            const humidity = document.getElementById('humidity');
            const windSpeed = document.getElementById('windSpeed');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error');
            const successElement = document.getElementById('success');
            
            // 天气代码到中文描述的映射（确保中文显示）
            const weatherCodeToChinese = {
                '113': '晴天',
                '116': '部分多云',
                '119': '多云',
                '122': '阴天',
                '143': '雾',
                '176': '小雨',
                '179': '雨夹雪',
                '182': '雨夹雪',
                '185': '冻雨',
                '200': '雷暴',
                '227': '小雪',
                '230': '大雪',
                '248': '雾',
                '260': '浓雾',
                '263': '零星小雨',
                '266': '小雨',
                '281': '冻雨',
                '284': '冻雨',
                '293': '小雨',
                '296': '中雨',
                '299': '大雨',
                '302': '大雨',
                '305': '大雨',
                '308': '暴雨',
                '311': '冻雨',
                '314': '冻雨',
                '317': '雨夹雪',
                '320': '雨夹雪',
                '323': '小雪',
                '326': '小雪',
                '329': '中雪',
                '332': '大雪',
                '335': '暴雪',
                '338': '暴雪',
                '350': '雨夹雪',
                '353': '小雨',
                '356': '大雨',
                '359': '暴雨',
                '362': '雨夹雪',
                '365': '雨夹雪',
                '368': '小雪',
                '371': '暴雪',
                '374': '雨夹雪',
                '377': '冻雨',
                '386': '雷暴',
                '389': '雷暴',
                '392': '雷暴加雪',
                '395': '大雪'
            };
            
            // 天气代码到图标的映射
            const weatherCodeToIcon = {
                '113': '☀️', // 晴天
                '116': '⛅', // 部分多云
                '119': '☁️', // 多云
                '122': '☁️', // 阴天
                '143': '🌫️', // 雾
                '176': '🌦️', // 小雨
                '179': '🌨️', // 雨夹雪
                '182': '🌨️', // 雨夹雪
                '185': '🌧️', // 冻雨
                '200': '⛈️', // 雷暴
                '227': '🌨️', // 小雪
                '230': '❄️', // 大雪
                '248': '🌫️', // 雾
                '260': '🌫️', // 浓雾
                '263': '🌦️', // 零星小雨
                '266': '🌧️', // 小雨
                '281': '🌧️', // 冻雨
                '284': '🌧️', // 冻雨
                '293': '🌦️', // 小雨
                '296': '🌧️', // 中雨
                '299': '🌧️', // 大雨
                '302': '🌧️', // 大雨
                '305': '🌧️', // 大雨
                '308': '🌧️', // 暴雨
                '311': '🌧️', // 冻雨
                '314': '🌧️', // 冻雨
                '317': '🌨️', // 雨夹雪
                '320': '🌨️', // 雨夹雪
                '323': '🌨️', // 小雪
                '326': '🌨️', // 小雪
                '329': '❄️', // 中雪
                '332': '❄️', // 大雪
                '335': '❄️', // 暴雪
                '338': '❄️', // 暴雪
                '350': '🌨️', // 雨夹雪
                '353': '🌦️', // 小雨
                '356': '🌧️', // 大雨
                '359': '🌧️', // 暴雨
                '362': '🌨️', // 雨夹雪
                '365': '🌨️', // 雨夹雪
                '368': '🌨️', // 小雪
                '371': '❄️', // 暴雪
                '374': '🌨️', // 雨夹雪
                '377': '🌨️', // 冻雨
                '386': '⛈️', // 雷暴
                '389': '⛈️', // 雷暴
                '392': '⛈️', // 雷暴加雪
                '395': '❄️'  // 大雪
            };
            
            // 获取位置和天气信息
            async function getLocationAndWeather() {
                // 重置状态
                errorElement.classList.remove('active');
                errorElement.textContent = '';
                successElement.classList.remove('active');
                loadingElement.classList.add('active');
                getWeatherBtn.disabled = true;
                btnText.textContent = '获取中...';
                currentLocationElement.textContent = '正在获取位置...';
                currentLocationElement.classList.add('placeholder');
                
                try {
                    // 第一步：获取IP地址和位置信息
                    console.log('正在获取位置信息...');
                    
                    // 使用免费的IP地理位置API
                    const locationResponse = await fetch('https://api.my-ip.io/v2/ip.json');
                    
                    if (!locationResponse.ok) {
                        throw new Error('位置API响应错误');
                    }
                    
                    const locationData = await locationResponse.json();
                    console.log('位置数据:', locationData);
                    
                    // 提取位置信息
                    let locationStr = '';
                    if (locationData.country && locationData.country.name) {
                        locationStr = locationData.country.name;
                    }
                    
                    if (locationData.city) {
                        if (locationStr) {
                            locationStr += ', ' + locationData.city;
                        } else {
                            locationStr = locationData.city;
                        }
                    }
                    
                    if (!locationStr) {
                        locationStr = '位置信息不可用';
                    }
                    
                    currentLocationElement.textContent = locationStr;
                    currentLocationElement.classList.remove('placeholder');
                    
                    // 第二步：获取天气信息
                    console.log('正在获取天气信息...');
                    
                    // 优先使用城市名查询天气，如果没有则使用国家名
                    let weatherQuery = '';
                    if (locationData.city) {
                        // 使用城市名
                        weatherQuery = locationData.city;
                    } else if (locationData.country && locationData.country.name) {
                        // 如果没有城市信息，使用国家名
                        weatherQuery = locationData.country.name;
                    } else {
                        throw new Error('无法确定天气查询位置');
                    }
                    
                    // 移除空格，避免API解析错误
                    weatherQuery = weatherQuery.replace(/\s+/g, '');
                    
                    // 方法1：使用wttr.in API（格式化为JSON）
                    const weatherResponse = await fetch(`https://wttr.in/${encodeURIComponent(weatherQuery)}?format=j1&lang=zh`);
                    
                    if (!weatherResponse.ok) {
                        // 如果失败，尝试方法2：直接获取文本格式
                        throw new Error('天气API响应错误，尝试备用API');
                    }
                    
                    const weatherData = await weatherResponse.json();
                    console.log('天气数据:', weatherData);
                    
                    // 提取并显示天气信息
                    displayWeather(weatherData, locationData.city || locationData.country.name);
                    
                    // 显示天气卡片
                    weatherCard.style.display = 'flex';
                    
                    // 显示成功消息
                    successElement.textContent = '天气信息获取成功！';
                    successElement.classList.add('active');
                    setTimeout(() => successElement.classList.remove('active'), 3000);
                    
                } catch (error) {
                    console.error('获取信息时出错:', error);
                    
                    // 尝试备用方法：使用openweathermap API（需要免费API密钥，这里使用示例密钥）
                    try {
                        console.log('尝试使用备用天气API...');
                        
                        // 使用另一个免费API（使用示例API密钥，实际使用需要注册获取自己的密钥）
                        const backupWeatherResponse = await fetch('https://api.openweathermap.org/data/2.5/weather?q=Beijing&appid=b6907d289e10d714a6e88b30761fae22&units=metric&lang=zh_cn');
                        
                        if (backupWeatherResponse.ok) {
                            const backupWeatherData = await backupWeatherResponse.json();
                            console.log('备用天气数据:', backupWeatherData);
                            
                            // 显示备用天气信息
                            displayBackupWeather(backupWeatherData);
                            weatherCard.style.display = 'flex';
                            
                            successElement.textContent = '使用备用API获取天气成功！';
                            successElement.classList.add('active');
                            setTimeout(() => successElement.classList.remove('active'), 3000);
                        } else {
                            throw new Error('备用API也失败了');
                        }
                    } catch (backupError) {
                        console.error('备用API也失败了:', backupError);
                        
                        // 显示错误信息
                        let errorMessage = '获取天气信息失败，请稍后重试。';
                        
                        if (error.message.includes('网络请求失败')) {
                            errorMessage = '网络请求失败，请检查网络连接后重试。';
                        } else if (error.message.includes('位置API响应错误')) {
                            errorMessage = '无法获取当前位置信息，请检查网络连接。';
                        }
                        
                        errorElement.innerHTML = `
                            <strong>错误详情:</strong> ${errorMessage}
                            <br><br>
                            <button class="retry-btn" id="retryBtn">重试</button>
                        `;
                        errorElement.classList.add('active');
                        
                        // 添加重试按钮事件
                        document.getElementById('retryBtn').addEventListener('click', getLocationAndWeather);
                        
                        // 恢复占位符文本
                        currentLocationElement.textContent = '获取失败';
                    }
                } finally {
                    loadingElement.classList.remove('active');
                    getWeatherBtn.disabled = false;
                    btnText.textContent = '重新获取天气';
                }
            }
            
            // 显示天气信息（使用wttr.in API）
            function displayWeather(weatherData, locationName) {
                // 获取当前天气
                const currentCondition = weatherData.current_condition[0];
                
                // 天气代码
                const weatherCode = currentCondition.weatherCode;
                
                // 使用映射表获取中文描述，确保是中文
                let chineseDesc = weatherCodeToChinese[weatherCode];
                
                // 如果映射表中没有，尝试使用API返回的描述
                if (!chineseDesc && currentCondition.weatherDesc && currentCondition.weatherDesc.length > 0) {
                    // 尝试找到中文描述
                    const chineseWeatherDesc = currentCondition.weatherDesc.find(desc => 
                        desc.lang === 'zh-cn' || desc.lang === 'zh'
                    );
                    
                    if (chineseWeatherDesc) {
                        chineseDesc = chineseWeatherDesc.value;
                    } else if (currentCondition.weatherDesc[0]) {
                        // 如果没有中文，使用第一个描述
                        chineseDesc = currentCondition.weatherDesc[0].value;
                    }
                }
                
                // 如果还是没有，使用默认值
                if (!chineseDesc) {
                    chineseDesc = '天气信息';
                }
                
                // 显示天气描述
                weatherDesc.textContent = chineseDesc + (locationName ? ` (${locationName})` : '');
                
                // 温度
                const tempC = currentCondition.temp_C;
                const feelsLikeC = currentCondition.FeelsLikeC;
                weatherTemp.textContent = `${tempC}°C`;
                feelsLike.textContent = `${feelsLikeC}°C`;
                
                // 湿度
                humidity.textContent = `${currentCondition.humidity}%`;
                
                // 风速
                windSpeed.textContent = `${currentCondition.windspeedKmph} km/h`;
                
                // 根据天气代码设置图标
                setWeatherIcon(weatherCode, weatherIcon);
            }
            
            // 显示备用天气信息（使用openweathermap API）
            function displayBackupWeather(weatherData) {
                // 天气描述（确保中文）
                let chineseDesc = weatherData.weather[0].description || '天气信息';
                weatherDesc.textContent = chineseDesc + ` (${weatherData.name})`;
                
                // 温度
                const tempC = Math.round(weatherData.main.temp);
                const feelsLikeC = Math.round(weatherData.main.feels_like);
                weatherTemp.textContent = `${tempC}°C`;
                feelsLike.textContent = `${feelsLikeC}°C`;
                
                // 湿度
                humidity.textContent = `${weatherData.main.humidity}%`;
                
                // 风速（转换m/s为km/h）
                const windKmph = Math.round(weatherData.wind.speed * 3.6);
                windSpeed.textContent = `${windKmph} km/h`;
                
                // 根据天气ID设置图标
                const weatherId = weatherData.weather[0].id;
                setWeatherIconByOpenWeatherId(weatherId, weatherIcon);
            }
            
            // 根据天气代码设置图标（wttr.in）
            function setWeatherIcon(weatherCode, iconElement) {
                if (weatherCodeToIcon[weatherCode]) {
                    iconElement.textContent = weatherCodeToIcon[weatherCode];
                } else {
                    // 默认图标
                    iconElement.textContent = '🌤️';
                }
            }
            
            // 根据openweathermap天气ID设置图标
            function setWeatherIconByOpenWeatherId(weatherId, iconElement) {
                // openweathermap天气ID到图标的映射
                if (weatherId >= 200 && weatherId < 300) {
                    // 雷暴
                    iconElement.textContent = '⛈️';
                } else if (weatherId >= 300 && weatherId < 400) {
                    // 毛毛雨
                    iconElement.textContent = '🌧️';
                } else if (weatherId >= 500 && weatherId < 600) {
                    // 雨
                    iconElement.textContent = '🌧️';
                } else if (weatherId >= 600 && weatherId < 700) {
                    // 雪
                    iconElement.textContent = '❄️';
                } else if (weatherId >= 700 && weatherId < 800) {
                    // 大气条件（雾、尘等）
                    iconElement.textContent = '🌫️';
                } else if (weatherId === 800) {
                    // 晴天
                    iconElement.textContent = '☀️';
                } else if (weatherId > 800 && weatherId < 900) {
                    // 多云
                    iconElement.textContent = '☁️';
                } else {
                    // 默认
                    iconElement.textContent = '🌤️';
                }
            }
            
            // 绑定按钮点击事件
            getWeatherBtn.addEventListener('click', getLocationAndWeather);
        });
    </script>
</body>
</html>
