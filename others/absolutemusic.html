<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- ✅ 关键：移动端适配 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>在线音乐播放器 - Wesley</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fa;
      margin: 0;
      padding: 20px 16px 220px;
      display: flex;
      justify-content: center;
    }

    .music-container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 22px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    li:hover {
      background: #f0f4ff;
    }

    li.active {
      background: #e8f0fe;
      font-weight: bold;
      color: #1a73e8;
    }

    .status {
      font-size: 13px;
      color: #666;
    }

    /* ===== 底部播放器 ===== */
    .audio-bar {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 1000;
    }

    .controls {
      display: flex;
      flex-wrap: wrap; /* ✅ 允许换行 */
      gap: 10px;
      margin-bottom: 12px;
    }

    .controls button,
    .controls a {
      flex: 1 1 30%;
      text-align: center;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
    }

    audio {
      width: 100%;
      height: 42px;
    }

    /* ===== 手机端进一步优化 ===== */
    @media (max-width: 480px) {
      h1 {
        font-size: 20px;
      }

      .controls button,
      .controls a {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>

<div class="music-container">
  <h1>🎵 在线音乐播放列表</h1>

  

  <ul id="playlist">
    <li data-src="music/birds-forest-nature-445379.mp3">
      <span class="song-title">birds-forest-nature</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/ocean-waves-250310.mp3">
      <span class="song-title">ocean-waves</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/rain-sound-188158.mp3">
      <span class="song-title">rain-sound</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/calming-rain-257596.mp3">
      <span class="song-title">calming-rain</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/rippling-stream-459512.mp3">
      <span class="song-title">rippling-stream</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/stream-water-with-birds-459511.mp3">
      <span class="song-title">stream-water-with-birds</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/sunlight-through-grass-459264.mp3">
      <span class="song-title">sunlight-through-grass</span>
      <span class="status">▶ 播放</span>
    </li>
  </ul>
</div>

<div class="audio-bar">
  <div class="controls">
    <button id="prevBtn">⏮ 上一曲</button>
    <a href="index.html">🔙 返回主页</a>
    <button id="nextBtn">⏭ 下一曲</button>
  </div>
  <audio id="audioPlayer" controls></audio>
</div>

<script>
  const audio = document.getElementById('audioPlayer');
  const listItems = [...document.querySelectorAll('#playlist li')];
  let currentIndex = -1;

  function playByIndex(index) {
    if (index < 0 || index >= listItems.length) return;

    listItems.forEach(li => {
      li.classList.remove('active');
      li.querySelector('.status').textContent = '▶ 播放';
    });

    const item = listItems[index];
    currentIndex = index;
    item.classList.add('active');
    item.querySelector('.status').textContent = '⏸ 播放中';

    audio.src = item.dataset.src;
    audio.play();
  }

  listItems.forEach((li, i) => {
    li.onclick = () => playByIndex(i);
  });

  prevBtn.onclick = () => playByIndex(currentIndex - 1);
  nextBtn.onclick = () => playByIndex(currentIndex + 1);

  audio.onended = () => playByIndex(currentIndex + 1);
</script>

</body>
</html>
