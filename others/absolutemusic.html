<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>在线音乐播放器 - Wesley</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px 180px; /* 增加底部留白 */
      display: flex;
      justify-content: center;
    }

    .music-container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    li:hover {
      background: #f0f4ff;
    }

    li.active {
      background: #e8f0fe;
      font-weight: bold;
      color: #1a73e8;
    }

    .song-title {
      flex: 1;
    }

    .status {
      font-size: 14px;
      color: #999;
    }

    /* ===== 底部播放器 ===== */
    .audio-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      padding: 20px 16px; /* 增加高度 */
      z-index: 1000;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px; /* 增加空间 */
    }

    .controls button,
    .controls a {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px; /* 按钮更大 */
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .controls button:hover,
    .controls a:hover {
      background: #1558c0;
    }

    audio {
      width: 100%;
      height: 40px; /* 增高播放器条 */
    }
  </style>
</head>
<body>

<div class="music-container">
  <h1>🎵 在线音乐播放列表</h1>

  <ul id="playlist">
    <li data-src="music/birds-forest-nature-445379.mp3">
      <span class="song-title">birds-forest-nature</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/ocean-waves-250310.mp3">
      <span class="song-title">ocean-waves</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/rain-sound-188158.mp3">
      <span class="song-title">rain-sound</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/calming-rain-257596.mp3">
      <span class="song-title">calming-rain</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/rippling-stream-459512.mp3">
      <span class="song-title">rippling-stream</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/stream-water-with-birds-459511.mp3">
      <span class="song-title">stream-water-with-birds</span>
      <span class="status">▶ 播放</span>
    </li>
    <li data-src="music/sunlight-through-grass-459264.mp3">
      <span class="song-title">sunlight-through-grass</span>
      <span class="status">▶ 播放</span>
    </li>
  </ul>
</div>

<!-- 底部固定播放器 -->
<div class="audio-bar">
  <div class="controls">
    <button id="prevBtn">⏮ 上一曲</button>
    <a href="index.html">🔙 返回主页</a>
    <button id="nextBtn">⏭ 下一曲</button>
  </div>
  <audio id="audioPlayer" controls></audio>
</div>

<script>
  const audio = document.getElementById('audioPlayer');
  const listItems = Array.from(document.querySelectorAll('#playlist li'));
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let currentIndex = -1;

  function playByIndex(index) {
    if (index < 0 || index >= listItems.length) return;

    listItems.forEach(li => {
      li.classList.remove('active');
      li.querySelector('.status').textContent = '▶ 播放';
    });

    const item = listItems[index];
    currentIndex = index;

    item.classList.add('active');
    item.querySelector('.status').textContent = '⏸ 播放中';

    audio.src = item.dataset.src;
    audio.play();
  }

  // 点击列表播放
  listItems.forEach((item, index) => {
    item.addEventListener('click', () => playByIndex(index));
  });

  // 上一曲
  prevBtn.onclick = () => {
    if (currentIndex > 0) {
      playByIndex(currentIndex - 1);
    }
  };

  // 下一曲
  nextBtn.onclick = () => {
    if (currentIndex < listItems.length - 1) {
      playByIndex(currentIndex + 1);
    }
  };

  // 播放结束 → 自动下一曲
  audio.addEventListener('ended', () => {
    if (currentIndex < listItems.length - 1) {
      playByIndex(currentIndex + 1);
    }
  });
</script>

</body>
</html>
