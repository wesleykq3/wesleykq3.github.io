<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟花绽放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            margin: 20px;
            max-width: 800px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ff0080, #ff8c00, #40e0d0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            animation: pulse 2s infinite alternate;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #ff0080, #ff8c00);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 128, 0.4);
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 128, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        .instructions {
            margin-top: 30px;
            font-size: 1rem;
            color: #aaa;
            line-height: 1.5;
        }

        .instructions span {
            color: #ff8c00;
            font-weight: bold;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            100% {
                transform: scale(1.05);
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="fireworksCanvas"></canvas>
    </div>
    
    <div class="content">
        <h1>烟花绽放</h1>
        <p>夜空中的绚丽烟花，为你的屏幕带来璀璨光影。点击页面任意位置或使用下方按钮创建更多烟花。</p>
        
        <div class="controls">
            <button id="moreFireworks">更多烟花</button>
            <button id="changeColors">变换颜色</button>
            <button id="toggleSound">音效: 开启</button>
            <button id="fullscreen">全屏模式</button>
        </div>
        
        <div class="instructions">
            <p><span>交互提示：</span> 点击页面任意位置发射烟花 | 鼠标移动影响烟花方向 | 按空格键随机发射烟花</p>
        </div>
    </div>

    <audio id="fireworkSound" loop>
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-firework-show-audio-3064.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置Canvas尺寸为窗口大小
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 音频元素
        const fireworkSound = document.getElementById('fireworkSound');
        let soundEnabled = true;
        
        // 烟花颜色数组
        let colorPalettes = [
            ['#ff0080', '#ff8c00', '#40e0d0', '#ff1493', '#00ffff'], // 霓虹色调
            ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#ff00ff'], // 彩虹色调
            ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff', '#d83bd2'], // 明亮色调
            ['#9d4edd', '#ff9e00', '#38b000', '#4361ee', '#f72585']  // 现代色调
        ];
        let currentPalette = 0;
        
        // 烟花数组
        let fireworks = [];
        let particles = [];
        
        // 鼠标位置
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        
        // 烟花类
        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.startX = x;
                this.startY = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - x, targetY - y);
                this.distanceTraveled = 0;
                this.trail = [];
                this.trailLength = 15;
                
                // 随机选择颜色
                this.color = colorPalettes[currentPalette][Math.floor(Math.random() * colorPalettes[currentPalette].length)];
                
                // 随机速度
                this.speed = 8 + Math.random() * 5;
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = {
                    x: Math.cos(this.angle) * this.speed,
                    y: Math.sin(this.angle) * this.speed
                };
                
                // 加速度和重力
                this.acceleration = 0.98;
                this.gravity = 0.2;
                this.brightness = 1;
                this.targetRadius = 1;
            }
            
            update() {
                // 保存轨迹
                this.trail.push([this.x, this.y]);
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }
                
                // 应用速度
                this.velocity.x *= this.acceleration;
                this.velocity.y *= this.acceleration;
                this.velocity.y += this.gravity;
                
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                // 计算已移动距离
                this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);
                
                // 如果接近目标或移动距离超过目标距离，则爆炸
                if (this.distanceTraveled >= this.distanceToTarget * 0.9 || 
                    Math.abs(this.velocity.x) < 0.5 && Math.abs(this.velocity.y) < 0.5) {
                    this.explode();
                    return false;
                }
                
                return true;
            }
            
            explode() {
                // 播放音效
                if (soundEnabled) {
                    fireworkSound.currentTime = 0;
                    fireworkSound.play();
                }
                
                // 创建爆炸粒子
                let particleCount = 80 + Math.random() * 50;
                
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        this.color
                    ));
                }
                
                // 可能创建额外的颜色粒子
                if (Math.random() < 0.3) {
                    let secondaryColor = colorPalettes[currentPalette][Math.floor(Math.random() * colorPalettes[currentPalette].length)];
                    for (let i = 0; i < particleCount / 2; i++) {
                        particles.push(new Particle(
                            this.x,
                            this.y,
                            secondaryColor
                        ));
                    }
                }
            }
            
            draw() {
                // 绘制轨迹
                ctx.beginPath();
                ctx.moveTo(this.trail[0][0], this.trail[0][1]);
                for (let i = 1; i < this.trail.length; i++) {
                    ctx.lineTo(this.trail[i][0], this.trail[i][1]);
                }
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 绘制烟花头部
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.targetRadius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // 添加发光效果
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.targetRadius * 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color + '40';
                ctx.fill();
            }
        }
        
        // 粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.decay = 0.01 + Math.random() * 0.02;
                this.size = 2 + Math.random() * 3;
                this.gravity = 0.05;
                this.friction = 0.97;
            }
            
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }
        
        // 创建随机烟花
        function createRandomFirework() {
            let startX = Math.random() * canvas.width;
            let startY = canvas.height;
            let targetX = mouseX + (Math.random() - 0.5) * 200;
            let targetY = mouseY + (Math.random() - 0.5) * 200;
            
            // 确保目标在画布内
            targetX = Math.max(50, Math.min(canvas.width - 50, targetX));
            targetY = Math.max(50, Math.min(canvas.height - 150, targetY));
            
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        }
        
        // 创建多个烟花
        function createMultipleFireworks(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    createRandomFirework();
                }, i * 50);
            }
        }
        
        // 初始化烟花
        function initFireworks() {
            // 初始创建一些烟花
            createMultipleFireworks(5);
            
            // 每隔一段时间自动创建烟花
            setInterval(() => {
                if (Math.random() < 0.5) {
                    createRandomFirework();
                }
            }, 1500);
        }
        
        // 动画循环
        function animate() {
            // 使用透明黑色矩形创建淡出效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新和绘制所有烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                if (!fireworks[i].update()) {
                    fireworks.splice(i, 1);
                } else {
                    fireworks[i].draw();
                }
            }
            
            // 更新和绘制所有粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                } else {
                    particles[i].draw();
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 事件监听
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        canvas.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        canvas.addEventListener('click', function(e) {
            let startX = Math.random() * canvas.width;
            let startY = canvas.height;
            fireworks.push(new Firework(startX, startY, e.clientX, e.clientY));
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                createMultipleFireworks(3);
            }
        });
        
        // 按钮事件
        document.getElementById('moreFireworks').addEventListener('click', function() {
            createMultipleFireworks(8);
        });
        
        document.getElementById('changeColors').addEventListener('click', function() {
            currentPalette = (currentPalette + 1) % colorPalettes.length;
            createMultipleFireworks(3);
        });
        
        document.getElementById('toggleSound').addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            this.textContent = soundEnabled ? '音效: 开启' : '音效: 关闭';
            
            if (!soundEnabled) {
                fireworkSound.pause();
            }
        });
        
        document.getElementById('fullscreen').addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`全屏请求失败: ${err.message}`);
                });
                this.textContent = '退出全屏';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    this.textContent = '全屏模式';
                }
            }
        });
        
        // 全屏变化监听
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                document.getElementById('fullscreen').textContent = '全屏模式';
            }
        });
        
        // 初始化
        initFireworks();
        animate();
        
        // 页面加载时显示欢迎信息
        window.addEventListener('load', function() {
            setTimeout(() => {
                createMultipleFireworks(10);
            }, 500);
        });
    </script>
</body>
</html>
