<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>目录</title>
  <style>
  body {
    margin: 0;
    padding: 40px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    background: #fff;
    color: #222;
  }

  .list {
    max-width: 900px;
    margin: 0 auto;
  }

  .item {
    display: flex;
    align-items: center;
    padding: 22px 10px;
    border-bottom: 1px dotted #e5e5e5;
    font-size: 18px;
    line-height: 1.6;
  }

  .item:last-child {
    border-bottom: none;
  }

  /* ✅ 标题加粗 */
  .title {
    flex: 1;
    font-weight: 600;
  }

  .desc {
    flex: 1;
    color: #999;
    font-size: 16px;
  }

  /* ❌ 日期不加粗 */
  .date {
    width: 120px;
    text-align: right;
    color: #999;
    font-size: 16px;
    font-weight: normal;
  }

  /* 链接继承外观 */
  .item a {
    color: inherit;
    text-decoration: none;
    font-weight: inherit;
  }

  .item a:hover {
    text-decoration: underline;
  }
</style>

</head>
<body>

<div class="list">

  <!-- 奖赏（普通目录项） -->
  <div class="item">
    <div class="title">奖赏</div>
    <div class="desc"></div>
    <div class="date">2026-01-01</div>
  </div>

  <!-- 烟花（样式完全一致，只是可点击） -->
  <div class="item">
    <div class="title">
      <a href="firework.html">烟花</a>
    </div>
    <div class="desc"></div>
    <div class="date">2026-01-01</div>
  </div>

</div>

</body>
</html>
