<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP地址和地理位置查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .ip-display {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #2575fc;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .ip-display h2 {
            color: #2575fc;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .info-item {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .info-label {
            font-weight: bold;
            color: #555;
            width: 120px;
            flex-shrink: 0;
        }
        
        .info-value {
            color: #222;
            font-size: 1.1rem;
            word-break: break-all;
        }
        
        .loading {
            color: #666;
            font-style: italic;
        }
        
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.5);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-icon {
            font-size: 1.3rem;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #eee;
            background-color: #f8f9fa;
        }
        
        
        .location-placeholder {
            text-align: center;
            padding: 20px;
        }
        
        .location-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #2575fc;
        }
        
        @media (max-width: 768px) {
            .container {
                border-radius: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 25px;
            }
            
            .info-item {
                flex-direction: column;
            }
            
            .info-label {
                width: 100%;
                margin-bottom: 5px;
            }
            
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .success {
            color: #4CAF50;
        }
        
        .location-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2575fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>IP地址和地理位置查询</h1>
            <p class="subtitle">一键获取您的IP地址和地理位置信息</p>
        </div>
        
        <div class="content">
            <div class="ip-display">
                <h2>您的网络信息</h2>
                <div class="info-item">
                    <span class="info-label">IP 地址:</span>
                    <span class="info-value" id="ipAddress" class="loading">等待获取...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">所在地区:</span>
                    <span class="info-value" id="location" class="loading">等待获取...</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ISP 提供商:</span>
                    <span class="info-value" id="isp" class="loading">等待获取...</span>
                </div>
            </div>
            
            
            <div class="btn-container">
                <button class="btn" id="getLocationBtn">
                    <span class="btn-icon">🌐</span>
                    <span id="btnText">获取我的IP和位置</span>
                </button>
            </div>
        </div>
        
        <div class="footer">
            <p>本服务使用公开的IP地理位置API，数据仅供参考 | 隐私保护: 我们不会存储您的任何信息</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const getLocationBtn = document.getElementById('getLocationBtn');
            const btnText = document.getElementById('btnText');
            const ipAddressEl = document.getElementById('ipAddress');
            const locationEl = document.getElementById('location');
            const ispEl = document.getElementById('isp');
            const locationPlaceholder = document.getElementById('locationPlaceholder');
            const locationDisplay = document.getElementById('locationDisplay');
            
            // 添加动画类
            document.querySelector('.ip-display').classList.add('fade-in');
            
            // 使用多个API作为备用，增加成功率
            const apiEndpoints = [
                {
                    name: 'ip-api.com',
                    url: 'https://ipapi.co/json/',
                    mapping: {
                        ip: 'ip',
                        city: 'city',
                        region: 'region',
                        country: 'country_name',
                        isp: 'org'
                    }
                },
                {
                    name: 'ip-api.com (中文)',
                    url: 'https://ipapi.co/json/?lang=zh-CN',
                    mapping: {
                        ip: 'ip',
                        city: 'city',
                        region: 'region',
                        country: 'country_name',
                        isp: 'org'
                    }
                },
                {
                    name: 'ipwhois',
                    url: 'https://ipwho.is/',
                    mapping: {
                        ip: 'ip',
                        city: 'city',
                        region: 'region',
                        country: 'country',
                        isp: 'connection.isp'
                    }
                },
                {
                    name: 'ipinfo.io',
                    url: 'https://ipinfo.io/json',
                    mapping: {
                        ip: 'ip',
                        city: 'city',
                        region: 'region',
                        country: 'country',
                        isp: 'org'
                    }
                }
            ];
            
            // 清理数据，移除"未知"字样
            function cleanData(value) {
                if (!value || value === '未知' || value.toLowerCase() === 'unknown') {
                    return '';
                }
                return value;
            }
            
            // 构建位置字符串
            function buildLocationString(city, country) {
                const cleanCity = cleanData(city);
                const cleanCountry = cleanData(country);
                
                if (cleanCity && cleanCountry) {
                    return `${cleanCity}, ${cleanCountry}`;
                } else if (cleanCity) {
                    return cleanCity;
                } else if (cleanCountry) {
                    return cleanCountry;
                } else {
                    return '位置信息获取中';
                }
            }
            
            // 尝试获取IP和地理位置
            async function getIPAndLocation(apiIndex = 0) {
                if (apiIndex >= apiEndpoints.length) {
                    throw new Error('所有API请求都失败了');
                }
                
                const api = apiEndpoints[apiIndex];
                
                try {
                    const response = await fetch(api.url);
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // 根据API映射提取数据
                    const getNestedValue = (obj, path) => {
                        return path.split('.').reduce((o, p) => o && o[p], obj);
                    };
                    
                    const ip = getNestedValue(data, api.mapping.ip);
                    const city = getNestedValue(data, api.mapping.city);
                    const country = getNestedValue(data, api.mapping.country);
                    const isp = getNestedValue(data, api.mapping.isp);
                    
                    return {
                        ip: ip || '',
                        city: city || '',
                        country: country || '',
                        isp: isp || '',
                        rawData: data
                    };
                } catch (error) {
                    console.log(`${api.name} 失败:`, error.message);
                    // 尝试下一个API
                    return getIPAndLocation(apiIndex + 1);
                }
            }
            
            // 显示位置信息
            function displayLocationInfo(info) {
                // 显示IP地址
                ipAddressEl.textContent = info.ip || '未获取到';
                ipAddressEl.classList.add('success');
                
                // 构建并显示位置信息
                const locationString = buildLocationString(info.city, info.country);
                locationEl.textContent = locationString;
                locationEl.classList.add('success');
                
                // 显示ISP信息
                ispEl.textContent = cleanData(info.isp) || '未获取到';
                ispEl.classList.add('success');
                
                // 添加动画效果
                [ipAddressEl, locationEl, ispEl].forEach(el => {
                    el.classList.add('fade-in');
                });
                
                // 显示位置详情
                showLocationDetail(info);
            }
            
            // 显示位置详情
            function showLocationDetail(info) {
                const locationString = buildLocationString(info.city, info.country);
                
                // 隐藏占位符
                locationPlaceholder.style.display = 'none';
                locationDisplay.style.display = 'block';
                
                // 创建一个简单的位置显示
                locationDisplay.innerHTML = `
                    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
                        <div style="font-size: 4rem; margin-bottom: 20px; color: #2575fc;">📍</div>
                        <div style="font-size: 1.8rem; font-weight: bold; color: #2575fc; margin-bottom: 10px;">${locationString}</div>
                        <div style="color: #666; margin-top: 10px;">IP: ${info.ip || '未获取到'}</div>
                        ${info.rawData && info.rawData.timezone ? `<div style="color: #666; margin-top: 5px;">时区: ${info.rawData.timezone}</div>` : ''}
                    </div>
                `;
            }
            
            // 处理按钮点击
            getLocationBtn.addEventListener('click', async function() {
                // 防止重复点击
                if (getLocationBtn.disabled) return;
                
                // 更新按钮状态
                getLocationBtn.disabled = true;
                btnText.textContent = '正在获取...';
                getLocationBtn.classList.add('pulse');
                
                // 重置显示
                ipAddressEl.textContent = '获取中...';
                locationEl.textContent = '获取中...';
                ispEl.textContent = '获取中...';
                
                // 清除之前的动画和成功类
                [ipAddressEl, locationEl, ispEl].forEach(el => {
                    el.classList.remove('fade-in', 'success');
                });
                
                // 重置位置显示
                locationPlaceholder.style.display = 'flex';
                locationDisplay.style.display = 'none';
                
                try {
                    const locationInfo = await getIPAndLocation();
                    displayLocationInfo(locationInfo);
                    
                    // 成功提示
                    btnText.innerHTML = '<span style="color:#4CAF50">✓</span> 获取成功';
                    
                    // 3秒后恢复按钮
                    setTimeout(() => {
                        getLocationBtn.disabled = false;
                        btnText.textContent = '重新获取信息';
                        getLocationBtn.classList.remove('pulse');
                    }, 3000);
                    
                } catch (error) {
                    console.error('获取位置信息失败:', error);
                    
                    // 显示错误信息
                    ipAddressEl.textContent = '获取失败';
                    locationEl.textContent = '请检查网络连接后重试';
                    ispEl.textContent = '服务不可用';
                    
                    // 错误提示
                    btnText.innerHTML = '<span style="color:#f44336">✗</span> 获取失败';
                    
                    // 2秒后恢复按钮
                    setTimeout(() => {
                        getLocationBtn.disabled = false;
                        btnText.textContent = '重新获取信息';
                        getLocationBtn.classList.remove('pulse');
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
