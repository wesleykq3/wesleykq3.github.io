<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>游戏中心 - Wesley的主页</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background: #f5f7fa;
    }

    .page-scale {
      transform: scale(0.9);
      transform-origin: top center;
      width: 111%;
    }

    .games-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      color: #2c3e50;
      font-size: 36px;
      margin-bottom: 20px;
      text-align: center;
    }

    .page-description {
      color: #7f8c8d;
      font-size: 18px;
      margin-bottom: 50px;
      text-align: center;
      max-width: 800px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 950px;
    }

    .game-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    .game-image {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .snake-bg { background: linear-gradient(135deg, #27ae60, #2ecc71); }
    .tetris-bg { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
    .gomoku-bg { background: linear-gradient(135deg, #f39c12, #e67e22); }
    .plane-bg { background: linear-gradient(135deg, #3498db, #2980b9); }
    .mine-bg { background: linear-gradient(135deg, #e74c3c, #c0392b); }

    .game-icon {
      width: 100px;
      height: 100px;
      font-size: 52px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .game-content {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .game-title {
      font-size: 26px;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .game-description {
      color: #7f8c8d;
      line-height: 1.6;
      flex-grow: 1;
    }

    .play-button {
      margin-top: 15px;
      padding: 10px;
      background: #3498db;
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }

    .back-link {
      margin-top: 40px;
      padding: 10px 20px;
      border: 2px solid #3498db;
      border-radius: 8px;
      color: #3498db;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="page-scale">
  <div class="games-container">
    <h2 class="page-title">选择你想玩的游戏</h2>
    <p class="page-description">我们提供了多款经典小游戏，点击游戏卡片即可开始</p>

    <div class="games-grid">

      <!-- 贪吃蛇 -->
      <a href="snake.html" class="game-card">
        <div class="game-image snake-bg">
          <div class="game-icon">🐍</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">贪吃蛇</h3>
          <p class="game-description">控制蛇不断成长，考验你的反应速度。</p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>

      <!-- 俄罗斯方块 -->
      <a href="tetris.html" class="game-card">
        <div class="game-image tetris-bg">
          <div class="game-icon">🧊</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">俄罗斯方块</h3>
          <p class="game-description">旋转与堆叠，消除整行赢得高分。</p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>

      <!-- 五子棋 -->
      <a href="gomoku.html" class="game-card">
        <div class="game-image gomoku-bg">
          <div class="game-icon">♟️</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">五子棋</h3>
          <p class="game-description">黑白对弈，先连五子者获胜。</p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>

      <!-- ✈️ 飞机大战 -->
      <a href="airplane.html" class="game-card">
        <div class="game-image plane-bg">
          <div class="game-icon">✈️</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">飞机大战</h3>
          <p class="game-description">控制战机躲避敌人并击落来袭目标。</p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>

      <!-- 💣 扫雷 -->
      <a href="minesweeper.html" class="game-card">
        <div class="game-image mine-bg">
          <div class="game-icon">💣</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">扫雷</h3>
          <p class="game-description">经典扫雷游戏，支持初级 / 中级 / 高级难度。</p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>
      <!-- 🧠 记忆翻牌 -->
      <a href="memory.html" class="game-card">
        <div class="game-image memory-bg">
          <div class="game-icon">🧠</div>
        </div>
        <div class="game-content">
          <h3 class="game-title">记忆翻牌</h3>
          <p class="game-description">
            翻开卡片寻找相同图案，考验你的记忆力与专注力。
          </p>
          <div class="play-button">开始游戏</div>
        </div>
      </a>
    </div>

    <a href="../index.html" class="back-link">返回主页</a>
  </div>
</div>

</body>
</html>
