<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 小游戏</title>

    <style>
        body {
            text-align: center;
            margin-top: 40px;
            font-family: Arial, sans-serif;
            background-color: #faf8ef;
        }

        h1 {
            font-size: 50px;
            color: #776e65;
            margin-bottom: 10px;
        }

        p.info {
            color: #776e65;
            margin-top: 10px;
        }

        #gameContainer {
            display: inline-block;
            margin-top: 20px;
        }

        #score {
            font-size: 24px;
            margin-bottom: 10px;
            color: #776e65;
            font-weight: bold;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .top-buttons button,
        .top-buttons a {
            font-size: 16px;
            padding: 6px 14px;
            border-radius: 6px;
            background-color: #8f7a66;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .top-buttons button:hover,
        .top-buttons a:hover {
            background-color: #746655;
        }

        /* === 固定棋盘尺寸 === */
        #gridContainer {
            width: 410px;
            height: 410px;
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(4, 90px);
            grid-gap: 10px;
            background-color: #bbada0;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* === 固定单个格子尺寸 === */
        .tile {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            background-color: #cdc1b4;
            border-radius: 6px;
            color: #776e65;
        }

        .tile-2 { background-color: #eee4da; }
        .tile-4 { background-color: #ede0c8; }
        .tile-8 { background-color: #f2b179; color: #fff; }
        .tile-16 { background-color: #f59563; color: #fff; }
        .tile-32 { background-color: #f67c5f; color: #fff; }
        .tile-64 { background-color: #f65e3b; color: #fff; }
        .tile-128 { background-color: #edcf72; color: #fff; font-size: 32px; }
        .tile-256 { background-color: #edcc61; color: #fff; font-size: 32px; }
        .tile-512 { background-color: #edc850; color: #fff; font-size: 32px; }
        .tile-1024 { background-color: #edc53f; color: #fff; font-size: 28px; }
        .tile-2048 { background-color: #edc22e; color: #fff; font-size: 28px; }

        #gameOverContainer {
            display: none;
            margin-top: 20px;
        }

        #gameOver {
            font-size: 36px;
            color: #776e65;
            margin-bottom: 10px;
        }

        #restartButton {
            font-size: 20px;
            padding: 8px 20px;
            border-radius: 6px;
            background-color: #8f7a66;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #restartButton:hover {
            background-color: #746655;
        }
    </style>
</head>

<body>

<h1>2048</h1>
<p class="info">使用键盘←↑↓→方向键或 WASD 移动方块，合并直到 2048！</p>

<div id="gameContainer">
    <div id="score">分数：0</div>

    <div class="top-buttons">
        <button id="restartTop">重新开始</button>
        <a href="./index.html">返回上一页</a>
    </div>

    <div id="gridContainer"></div>

    <div id="gameOverContainer">
        <div id="gameOver">游戏结束！</div>
        <button id="restartButton">重新开始</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const gridContainer = document.getElementById("gridContainer");
    const scoreDisplay = document.getElementById("score");
    const gameOverContainer = document.getElementById("gameOverContainer");
    const restartButton = document.getElementById("restartButton");
    const restartTop = document.getElementById("restartTop");

    let tiles = new Array(16).fill(null);
    let score = 0;
    let gameOver = false;

    function init() {
        tiles = new Array(16).fill(null);
        score = 0;
        gameOver = false;
        scoreDisplay.textContent = "分数：0";
        gameOverContainer.style.display = "none";
        addRandom();
        addRandom();
        draw();
    }

    function addRandom() {
        const empty = tiles.map((v, i) => v === null ? i : null).filter(v => v !== null);
        if (empty.length === 0) return;
        const i = empty[Math.floor(Math.random() * empty.length)];
        tiles[i] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
        gridContainer.innerHTML = "";
        tiles.forEach(v => {
            const d = document.createElement("div");
            d.className = "tile";
            if (v) {
                d.textContent = v;
                d.classList.add("tile-" + v);
            }
            gridContainer.appendChild(d);
        });
    }

    function move(dir) {
        if (gameOver) return;
        let moved = false;

        const slide = line => {
            let arr = line.filter(v => v);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = null;
                }
            }
            arr = arr.filter(v => v);
            while (arr.length < 4) arr.push(null);
            return arr;
        };

        for (let i = 0; i < 4; i++) {
            let line, result;
            if (dir === "left" || dir === "right") {
                line = tiles.slice(i * 4, i * 4 + 4);
                if (dir === "right") line.reverse();
                result = slide(line);
                if (dir === "right") result.reverse();
                for (let j = 0; j < 4; j++) {
                    if (tiles[i * 4 + j] !== result[j]) moved = true;
                    tiles[i * 4 + j] = result[j];
                }
            } else {
                line = [tiles[i], tiles[i + 4], tiles[i + 8], tiles[i + 12]];
                if (dir === "down") line.reverse();
                result = slide(line);
                if (dir === "down") result.reverse();
                for (let j = 0; j < 4; j++) {
                    if (tiles[i + j * 4] !== result[j]) moved = true;
                    tiles[i + j * 4] = result[j];
                }
            }
        }

        if (moved) {
            addRandom();
            draw();
            scoreDisplay.textContent = `分数：${score}`;
            checkOver();
        }
    }

    function checkOver() {
        if (tiles.includes(null)) return;
        for (let i = 0; i < 16; i++) {
            if (i % 4 !== 3 && tiles[i] === tiles[i + 1]) return;
            if (i < 12 && tiles[i] === tiles[i + 4]) return;
        }
        gameOver = true;
        gameOverContainer.style.display = "block";
    }

    document.addEventListener("keydown", e => {
        const map = {
            ArrowUp: "up", w: "up",
            ArrowDown: "down", s: "down",
            ArrowLeft: "left", a: "left",
            ArrowRight: "right", d: "right"
        };
        if (map[e.key]) move(map[e.key]);
    });

    restartButton.onclick = init;
    restartTop.onclick = init;

    init();
});
</script>

</body>
</html>
