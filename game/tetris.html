<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>俄罗斯方块 - Wesley的游戏中心</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/tetris.css">
</head>
<body>

<header class="site-header">
  <img src="../images/avatar.png" alt="LOGO" class="logo">
  <h1>俄罗斯方块</h1>
</header>

<div class="game-container">
  <div class="game-wrapper">
    <div class="game-header">
      <div class="game-title">俄罗斯方块</div>
      <div class="game-controls">
        <button id="startBtn" class="control-btn">开始游戏</button>
        <button id="pauseBtn" class="control-btn">暂停</button>
        <button id="restartBtn" class="control-btn">重新开始</button>
        <button id="backBtn" class="control-btn">返回</button>
      </div>
    </div>
    
    <div class="game-content">
      <div class="game-area">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div id="gameOver" class="game-over">
          <h2>游戏结束!</h2>
          <p>你的得分: <span id="finalScore">0</span></p>
          <p>消除行数: <span id="finalLines">0</span></p>
          <button id="playAgainBtn" class="control-btn">再玩一次</button>
        </div>
        <div id="gameStart" class="game-start">
          <h2>俄罗斯方块</h2>
          <p>使用键盘控制方块移动和旋转</p>
          <p>完成完整的行可以消除并得分</p>
          <p>方块堆到顶部游戏结束</p>
          <button id="startFromHereBtn" class="control-btn">开始游戏</button>
        </div>
      </div>
      
      <div class="game-sidebar">
        <div class="next-piece-container">
          <h3>下一个方块</h3>
          <canvas id="nextPieceCanvas" width="120" height="120"></canvas>
        </div>
        
        <div class="game-stats">
          <div class="stat-item">
            <span class="stat-label">分数:</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">等级:</span>
            <span id="level" class="stat-value">1</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">行数:</span>
            <span id="lines" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">最高分:</span>
            <span id="highScore" class="stat-value">0</span>
          </div>
        </div>
        
        <div class="game-instructions">
          <h3>控制说明:</h3>
          <ul>
            <li><strong>← →</strong>: 左右移动</li>
            <li><strong>↑</strong>: 旋转方块</li>
            <li><strong>↓</strong>: 加速下落</li>
            <li><strong>空格</strong>: 直接落下</li>
            <li><strong>P</strong>: 暂停/继续</li>
            <li><strong>R</strong>: 重新开始</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <p>© <span id="currentDate"></span> Wesley Lin</p>
</footer>

<script src="js/tetris.js"></script>
<script>
// 设置当前日期
function formatDate(date) {
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  
  const formattedMonth = month < 10 ? '0' + month : month;
  const formattedDay = day < 10 ? '0' + day : day;
  
  return `${year}年${formattedMonth}月${formattedDay}日`;
}

document.addEventListener('DOMContentLoaded', function() {
  const now = new Date();
  const dateElement = document.getElementById('currentDate');
  
  if (dateElement) {
    dateElement.textContent = formatDate(now);
  }
  
  // 返回按钮功能
  document.getElementById('backBtn').addEventListener('click', function() {
    window.location.href = 'index.html';
  });
});
</script>
</body>
</html>
