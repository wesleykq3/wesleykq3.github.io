<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>招聘岗位 - Wesley 的主页</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f5f7fa;
      margin: 0;
      padding: 40px;
    }

    .job-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .job-header,
    .job-item {
      display: grid;
      grid-template-columns: 3fr 2fr 2fr 2fr;
      padding: 16px 24px;
      align-items: center;
    }

    .job-header {
      background: #f0f3f7;
      font-weight: bold;
      color: #555;
    }

    .job-item {
      border-top: 1px solid #eee;
      cursor: pointer;
      transition: background 0.2s;
    }

    .job-item:hover {
      background: #f8fbff;
    }

    .job-title {
      color: #2c3e50;
      font-weight: 600;
    }

    .job-meta {
      color: #666;
      font-size: 14px;
    }

    .job-date {
      color: #999;
      font-size: 14px;
      text-align: right;
    }
    
 /* 底部中间返回首页 */
    .back-home {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    .back-home a {
      display: inline-block;
      padding: 14px 34px;
      background: #2d8cf0;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(45,140,240,0.3);
      transition: all 0.25s ease;
    }

    .back-home a:hover {
      background: #1a73e8;
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(45,140,240,0.4);
    }
  </style>
</head>
<body>

<div class="job-container">
  <div class="job-header">
    <div>招聘岗位</div>
    <div>工作地点</div>
    <div>岗位来源</div>
    <div style="text-align:right;">发布日期</div>
  </div>

  <!-- ✅ IT 运维工程师 → 固定跳转到 joblist/01job.html -->
  <div class="job-item" onclick="window.location.href='joblist/01job.html'">
    <div class="job-title">IT 运维工程师</div>
    <div class="job-meta">深圳</div>
    <div class="job-meta">BOSS直聘</div>
    <div class="job-date">2026-01-01</div>
  </div>


</div>

<script>
  function openJob(id) {
    window.location.href = `job-detail.html?id=${id}`;
  }
</script>
<!-- 底部中间：返回首页 -->
<div class="back-home">
  <a href="../index.html">← 返回首页</a>
</div>
</body>
</html>
