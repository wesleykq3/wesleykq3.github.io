<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>目录</title>
  <style>
    body {
      margin: 0;
      padding: 40px 0 80px; /* 增加底部内边距，为固定页码留空间 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: #fff;
      color: #222;
      position: relative;
      min-height: 100vh;
    }

    .list {
      max-width: 900px;
      margin: 0 auto;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 22px 10px;
      border-bottom: 1px dotted #e5e5e5;
      font-size: 18px;
      line-height: 1.6;
    }

    .item:last-child {
      border-bottom: none;
    }

    /* ✅ 标题加粗 */
    .title {
      flex: 1;
      font-weight: 600;
    }

    .desc {
      flex: 1;
      color: #999;
      font-size: 16px;
    }

    /* ❌ 日期不加粗 */
    .date {
      width: 120px;
      text-align: right;
      color: #999;
      font-size: 16px;
      font-weight: normal;
    }

    /* 链接继承外观 */
    .item a {
      color: inherit;
      text-decoration: none;
      font-weight: inherit;
    }

    .item a:hover {
      text-decoration: underline;
    }
    
    /* 底部页码样式 - 固定在底部 */
    .page-indicator {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 20px 0;
      color: #666;
      font-size: 16px;
      font-weight: normal;
      background-color: #fff;
      border-top: 1px solid #e5e5e5;
      z-index: 10;
    }
    
    /* 响应式调整 */
    @media (max-width: 600px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .date {
        width: 100%;
        text-align: left;
      }
      
      .desc {
        display: none; /* 在小屏幕上隐藏描述 */
      }
      
      .page-indicator {
        padding: 15px 0;
      }
    }
  </style>
</head>
<body>

<div class="list">
  <!-- 奖赏（普通目录项） -->
  <div class="item">
    <div class="title">奖赏</div>
    <div class="desc"></div>
    <div class="date">2026-01-01</div>
  </div>

  <!-- 烟花（样式完全一致，只是可点击） -->
  <div class="item">
    <div class="title">
      <a href="firework.html">烟花</a>
    </div>
    <div class="desc"></div>
    <div class="date">2026-01-01</div>
  </div>
</div>

<!-- 底部页码显示 - 固定在底部 -->
<div class="page-indicator">
  第1页
</div>

<script>
  // 添加一些简单的交互功能
  document.addEventListener('DOMContentLoaded', function() {
    // 为所有项目添加点击效果
    const items = document.querySelectorAll('.item');
    items.forEach(item => {
      item.addEventListener('click', function(e) {
        // 如果点击的是链接，则不执行额外操作
        if (e.target.tagName === 'A' || e.target.closest('a')) {
          return;
        }
        
        // 否则，如果有链接，则跳转
        const link = this.querySelector('a');
        if (link) {
          window.location.href = link.href;
        }
      });
      
      // 添加悬停效果
      item.addEventListener('mouseenter', function() {
        const link = this.querySelector('a');
        if (link) {
          this.style.backgroundColor = '#f9f9f9';
          this.style.cursor = 'pointer';
        }
      });
      
      item.addEventListener('mouseleave', function() {
        const link = this.querySelector('a');
        if (link) {
          this.style.backgroundColor = '';
        }
      });
    });
    
    // 添加当前日期
    const today = new Date();
    const formattedDate = today.getFullYear() + '-' + 
                         String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                         String(today.getDate()).padStart(2, '0');
    
    // 如果有日期元素，则更新它们（只更新前两个示例日期）
    const dateElements = document.querySelectorAll('.date');
    if (dateElements.length > 0) {
      dateElements[0].textContent = formattedDate;
      if (dateElements.length > 1) {
        dateElements[1].textContent = formattedDate;
      }
    }
  });
</script>

</body>
</html>
