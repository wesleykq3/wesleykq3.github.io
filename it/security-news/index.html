<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>
安全资讯中心
</title>


<style>

body{

font-family:
Microsoft YaHei;

background:#f5f7fa;

padding:30px;

}


.container{

max-width:1000px;

margin:auto;

background:white;

padding:30px;

border-radius:10px;

}


button{

background:#2563eb;

color:white;

padding:12px 25px;

border:0;

border-radius:6px;

cursor:pointer;

}



.news{

margin-top:20px;

padding:20px;

border-bottom:1px solid #ddd;

}


.news a{

font-size:20px;

color:#2563eb;

text-decoration:none;

}


.date{

color:#777;

}


</style>


</head>



<body>


<div class="container">


<h1>
🛡️ 安全威胁情报中心
</h1>



<button onclick="loadNews()">

获取最新新闻

</button>



<div id="news">

</div>



</div>




<script>


function loadNews(){


fetch("news.json")


.then(response=>response.json())


.then(data=>{


let html="";


data.forEach(item=>{


html += `


<div class="news">


<a href="${item.url}" target="_blank">

${item.title}

</a>


<p class="date">

发布日期：
${item.date}

</p>



<p>

来源：
${item.source}

</p>



<p>

${item.summary}

</p>


</div>


`;


});



document.getElementById("news").innerHTML=html;



});


}



</script>



</body>

</html>
