name: Update Security News


on:

  schedule:

    # 每6小时执行一次

    - cron: "0 */6 * * *"


  # 允许手动执行

  workflow_dispatch:



jobs:

  update:


    runs-on:

      ubuntu-latest



    steps:


      # 下载代码

      - name:

          Checkout

        uses:

          actions/checkout@v4



      # 安装Python

      - name:

          Setup Python


        uses:

          actions/setup-python@v5


        with:


          python-version:

            "3.11"



      # 安装依赖

      - name:

          Install package


        run:


          pip install feedparser



      # 执行爬虫

      - name:

          Run spider


        run:


          python crawler/spider.py




      # 提交更新

      - name:

          Commit


        run:


          git config user.name github-actions


          git config user.email github-actions@github.com


          git add .


          git commit -m "update news" || exit 0


          git push
